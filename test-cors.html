<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test CORS - Riff Backend</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 900px;
            margin: 50px auto;
            padding: 20px;
            background: #1a1a1a;
            color: #fff;
        }
        .container {
            background: #2a2a2a;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        h1 {
            color: #FF4B2B;
            border-bottom: 2px solid #FF4B2B;
            padding-bottom: 10px;
        }
        button {
            background: #FF4B2B;
            color: white;
            border: none;
            padding: 12px 24px;
            margin: 10px 5px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }
        button:hover {
            background: #e6432a;
        }
        button:disabled {
            background: #666;
            cursor: not-allowed;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .success {
            background: #1e4620;
            border-left: 4px solid #4caf50;
        }
        .error {
            background: #4a1e1e;
            border-left: 4px solid #f44336;
        }
        .info {
            background: #1e3a4a;
            border-left: 4px solid #2196f3;
        }
        .warning {
            background: #4a3a1e;
            border-left: 4px solid #ff9800;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            background: #333;
            border: 1px solid #555;
            color: #fff;
            border-radius: 5px;
            font-size: 14px;
        }
        .token-info {
            background: #333;
            padding: 15px;
            border-radius: 5px;
            margin: 10px 0;
        }
        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 3px;
            font-size: 12px;
            margin: 0 5px;
        }
        .badge-success { background: #4caf50; }
        .badge-error { background: #f44336; }
        .badge-warning { background: #ff9800; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 Test de CORS - Backend Riff</h1>
        <p>Usa esta herramienta para verificar la configuración de CORS de tu backend</p>

        <div style="margin: 20px 0;">
            <label>URL del Backend:</label>
            <input type="text" id="backendUrl" value="http://localhost:4000" />
        </div>

        <div>
            <h3>Tests Básicos (Sin Autenticación)</h3>
            <button onclick="testArtists()">🎵 Test /api/users/artists</button>
            <button onclick="testHealth()">💚 Test Health Check</button>
        </div>

        <div style="margin-top: 20px;">
            <h3>Tests Autenticados</h3>
            <label>Token JWT:</label>
            <input type="text" id="tokenInput" placeholder="Pega tu token aquí o déjalo vacío para usar localStorage" />
            <button onclick="testMe()">👤 Test /api/users/me</button>
            <button onclick="decodeToken()">🔍 Decodificar Token</button>
            <button onclick="clearToken()">🗑️ Limpiar Token</button>
        </div>

        <div style="margin-top: 20px;">
            <h3>Información del Token</h3>
            <button onclick="showTokenInfo()">📋 Ver Info del Token</button>
        </div>

        <div id="result"></div>
    </div>

    <script>
        function getBackendUrl() {
            return document.getElementById('backendUrl').value.trim();
        }

        function getToken() {
            const inputToken = document.getElementById('tokenInput').value.trim();
            return inputToken || localStorage.getItem('token');
        }

        function showResult(message, type = 'info') {
            const resultDiv = document.getElementById('result');
            resultDiv.className = `result ${type}`;
            resultDiv.textContent = message;
        }

        function decodeJWT(token) {
            try {
                const parts = token.split('.');
                if (parts.length !== 3) return null;

                const payload = parts[1];
                const base64 = payload.replace(/-/g, '+').replace(/_/g, '/');
                const jsonPayload = decodeURIComponent(
                    atob(base64)
                        .split('')
                        .map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2))
                        .join('')
                );

                return JSON.parse(jsonPayload);
            } catch (error) {
                return null;
            }
        }

        function isTokenExpired(token) {
            const payload = decodeJWT(token);
            if (!payload || !payload.exp) return true;
            return payload.exp * 1000 < Date.now();
        }

        async function testArtists() {
            showResult('🔄 Probando /api/users/artists...', 'info');

            try {
                const response = await fetch(`${getBackendUrl()}/api/users/artists`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                const data = await response.json();

                if (response.ok) {
                    showResult(
                        `✅ CORS Funciona!\n\n` +
                        `Status: ${response.status}\n` +
                        `Artistas encontrados: ${data.length}\n\n` +
                        `Datos:\n${JSON.stringify(data, null, 2)}`,
                        'success'
                    );
                } else {
                    showResult(
                        `⚠️ Respuesta del servidor:\n\n` +
                        `Status: ${response.status}\n` +
                        `Error: ${JSON.stringify(data, null, 2)}`,
                        'warning'
                    );
                }
            } catch (error) {
                showResult(
                    `❌ Error de CORS!\n\n` +
                    `${error.message}\n\n` +
                    `Solución:\n` +
                    `1. Verifica que el backend esté corriendo\n` +
                    `2. Configura CORS en el backend (ver SOLUCION_CORS.md)\n` +
                    `3. Reinicia el servidor backend`,
                    'error'
                );
            }
        }

        async function testMe() {
            const token = getToken();

            if (!token) {
                showResult('❌ No hay token\n\nInicia sesión primero o pega un token en el campo', 'error');
                return;
            }

            if (isTokenExpired(token)) {
                showResult('⚠️ El token ha expirado\n\nInicia sesión nuevamente', 'warning');
                return;
            }

            showResult('🔄 Probando /api/users/me con autenticación...', 'info');

            try {
                const response = await fetch(`${getBackendUrl()}/api/users/me`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                const data = await response.json();

                if (response.ok) {
                    showResult(
                        `✅ Autenticación Funciona!\n\n` +
                        `Status: ${response.status}\n` +
                        `Usuario: ${data.name} (${data.email})\n` +
                        `Rol: ${data.role}\n\n` +
                        `Datos completos:\n${JSON.stringify(data, null, 2)}`,
                        'success'
                    );
                } else {
                    showResult(
                        `⚠️ Error en la autenticación:\n\n` +
                        `Status: ${response.status}\n` +
                        `Error: ${JSON.stringify(data, null, 2)}`,
                        'warning'
                    );
                }
            } catch (error) {
                showResult(
                    `❌ Error de CORS en petición autenticada!\n\n` +
                    `${error.message}\n\n` +
                    `Verifica que CORS permita el header 'Authorization'`,
                    'error'
                );
            }
        }

        async function testHealth() {
            showResult('🔄 Probando conexión al backend...', 'info');

            try {
                const response = await fetch(`${getBackendUrl()}/api/health`, {
                    method: 'GET'
                });

                if (response.ok) {
                    const data = await response.json();
                    showResult(
                        `✅ Backend funcionando!\n\n` +
                        `Status: ${response.status}\n` +
                        `Respuesta: ${JSON.stringify(data, null, 2)}`,
                        'success'
                    );
                } else {
                    showResult(
                        `⚠️ Backend respondió con status ${response.status}`,
                        'warning'
                    );
                }
            } catch (error) {
                showResult(
                    `❌ No se pudo conectar al backend\n\n` +
                    `${error.message}\n\n` +
                    `Verifica que el backend esté corriendo en: ${getBackendUrl()}`,
                    'error'
                );
            }
        }

        function decodeToken() {
            const token = getToken();

            if (!token) {
                showResult('❌ No hay token para decodificar', 'error');
                return;
            }

            const payload = decodeJWT(token);

            if (!payload) {
                showResult('❌ Token inválido o mal formado', 'error');
                return;
            }

            const expired = isTokenExpired(token);
            const createdAt = payload.iat ? new Date(payload.iat * 1000).toLocaleString() : 'N/A';
            const expiresAt = payload.exp ? new Date(payload.exp * 1000).toLocaleString() : 'N/A';

            showResult(
                `🔍 Token Decodificado:\n\n` +
                `Estado: ${expired ? '❌ EXPIRADO' : '✅ VÁLIDO'}\n` +
                `Creado: ${createdAt}\n` +
                `Expira: ${expiresAt}\n\n` +
                `Payload:\n${JSON.stringify(payload, null, 2)}`,
                expired ? 'warning' : 'success'
            );
        }

        function showTokenInfo() {
            const token = getToken();

            if (!token) {
                showResult('❌ No hay token en localStorage ni en el input', 'error');
                return;
            }

            const payload = decodeJWT(token);

            if (!payload) {
                showResult('❌ Token inválido', 'error');
                return;
            }

            const expired = isTokenExpired(token);
            const minutesLeft = payload.exp ? Math.floor((payload.exp * 1000 - Date.now()) / 1000 / 60) : 0;

            showResult(
                `📋 Información del Token\n\n` +
                `Estado: ${expired ? '❌ EXPIRADO' : '✅ VÁLIDO'}\n` +
                `Tiempo restante: ${minutesLeft > 0 ? minutesLeft + ' minutos' : 'Expirado'}\n\n` +
                `Usuario:\n` +
                `  - ID: ${payload.id || 'N/A'}\n` +
                `  - Email: ${payload.email || 'N/A'}\n` +
                `  - Rol: ${payload.role || 'N/A'}\n\n` +
                `Token (primeros 50 caracteres):\n${token.substring(0, 50)}...`,
                expired ? 'warning' : 'success'
            );
        }

        function clearToken() {
            localStorage.removeItem('token');
            document.getElementById('tokenInput').value = '';
            showResult('✅ Token eliminado de localStorage y del input', 'success');
        }

        // Mostrar info al cargar
        window.onload = function() {
            const token = localStorage.getItem('token');
            if (token) {
                const payload = decodeJWT(token);
                const expired = isTokenExpired(token);
                showResult(
                    `ℹ️ Token encontrado en localStorage\n\n` +
                    `Estado: ${expired ? '⚠️ EXPIRADO' : '✅ VÁLIDO'}\n` +
                    `Usuario: ${payload?.email || 'Desconocido'}\n\n` +
                    `Usa los botones para probar el backend`,
                    expired ? 'warning' : 'info'
                );
            } else {
                showResult(
                    'ℹ️ No hay token en localStorage\n\n' +
                    'Inicia sesión en la aplicación o pega un token en el campo',
                    'info'
                );
            }
        };
    </script>
</body>
</html>
